<!DOCTYPE html>
<html lang="pt-BR"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget – Tabela de Produtos em PNG</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #f5f6f8;
      --surface:      #ffffff;
      --border:       #e2e5ec;
      --border-2:     #c8cdd8;
      --text:         #000000;
      --muted:        #6b7585;
      --accent:       #1a56db;
      --accent-bg:    #eef3fd;
      --accent-dim:   #c7d9f9;
      --green:        #15803d;
      --green-bg:     #f0fdf4;
      --green-border: #bbf7d0;
      --red:          #b91c1c;
      --red-bg:       #fef2f2;
      --red-border:   #fecaca;
      --head-bg:      #666666;
      --row-alt:      #f8faff;
      --radius:       10px;
      --shadow:       0 2px 8px rgba(0,0,0,.07);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
    }

    /* ── Input de arquivo: totalmente oculto, fora do fluxo visual ── */
    #fileIn {
      display: none;
    }

    /* ── Drop zone: sem input sobreposto ── */
    .drop-zone {
      background: var(--surface);
      border: 2px dashed var(--border-2);
      border-radius: var(--radius);
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color .18s, background .18s;
      user-select: none;
    }
    .drop-zone:hover {
      border-color: var(--accent);
      background: var(--accent-bg);
    }
    .drop-zone.over {
      border-color: var(--accent);
      background: var(--accent-bg);
      border-style: solid;
    }
    .drop-zone.hidden { display: none; }

    .dz-icon  { font-size: 36px; margin-bottom: 8px; pointer-events: none; }
    .dz-title { font-weight: 600; font-size: 14px; margin-bottom: 3px; pointer-events: none; color: #000000; }
    .dz-sub   { color: var(--muted); font-size: 12px; pointer-events: none; }
    .dz-sub code {
      background: var(--border); padding: 1px 6px; border-radius: 4px;
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
    }

    /* ── Status ── */
    .status {
      display: none; align-items: center; gap: 8px;
      margin-top: 10px; padding: 9px 14px; border-radius: 8px;
      font-size: 13px; font-weight: 500;
    }
    .status.ok  { display: flex; background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
    .status.err { display: flex; background: var(--red-bg);   color: var(--red);   border: 1px solid var(--red-border); }

    /* ── Meta bar ── */
    .meta-bar {
      display: none; align-items: center; justify-content: space-between;
      margin-top: 12px; gap: 8px; flex-wrap: wrap;
    }
    .meta-bar.on { display: flex; }
    .chips { display: none; gap: 6px; flex-wrap: wrap; }
    .chips.on { display: flex; }
    .chip {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 3px 10px; font-size: 11px; color: #000000;
      font-family: 'JetBrains Mono', monospace;
    }
    .chip b { color: var(--accent); }

    /* ── Botões ── */
    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 14px; border-radius: 7px; border: none;
      font: 600 12px/1 'Inter', sans-serif; cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn:hover  { opacity: .85; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-ghost   { background: transparent; color: #000000; border: 1px solid var(--border); }
    .btn-primary { background: var(--accent); color: #fff; }

    /* ── Tabela ── */
    .tbl-wrap {
      display: none; margin-top: 12px;
      border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; box-shadow: var(--shadow);
    }
    .tbl-wrap.on { display: block; }
    .tbl-scroll  { overflow-x: auto; max-height: 320px; overflow-y: auto; }
    .tbl-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .tbl-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    thead th {
      background: var(--head-bg); color: #fff;
      padding: 9px 14px; text-align: left; font-weight: 600;
      font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
      white-space: nowrap; position: sticky; top: 0; z-index: 2;
      border-right: 1px solid rgba(255,255,255,.15);
    }
    thead th:last-child { border-right: none; }
    tbody tr:nth-child(odd)  { background: #ffffff; }
    tbody tr:nth-child(even) { background: #f8faff; }
    tbody tr:hover { background: var(--accent-bg) !important; }
    tbody td {
      padding: 8px 14px; border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border); vertical-align: middle; font-size: 11.5px;
      color: #000000;
    }
    tbody td:last-child { border-right: none; }
    tbody tr:last-child td { border-bottom: none; }
    td.col-fe   { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: #000000; background: #ffffff !important; white-space: nowrap; }
    td.col-ref  { color: #000000; }
    td.col-comp { font-family: 'JetBrains Mono', monospace; color: #000000; }

    /* ── Mensagem de sucesso ── */
    .sent-box {
      display: none; align-items: center; gap: 8px; margin-top: 12px;
      padding: 10px 14px; background: var(--green-bg);
      border: 1px solid var(--green-border); border-radius: 8px;
      font-size: 13px; color: var(--green); font-weight: 600;
    }
    .sent-box.on { display: flex; }
  </style>
<script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script></head>
<body>

<!-- Input fora da drop zone, totalmente invisível -->
<input type="file" id="fileIn" accept=".xlsx,.xls,.csv">

<!-- Drop zone sem nenhum elemento filho que intercepte eventos -->
<div class="drop-zone" id="dz" role="button" tabindex="0" aria-label="Selecionar planilha">
  <div class="dz-icon">📊</div>
  <div class="dz-title">Arraste a tabela de produtos aqui</div>
  <div class="dz-sub">ou clique para selecionar &nbsp;<code>.xlsx</code>&nbsp;<code>.xls</code>&nbsp;<code>.csv</code></div>
</div>

<div class="status" id="status" role="status" aria-live="polite"></div>

<div class="meta-bar" id="metaBar">
  <div class="chips" id="chips"></div>
  <div style="display:flex;gap:6px;">
    <button type="button" class="btn btn-ghost" id="btnReset">↩ Novo arquivo</button>
  </div>
</div>

<div class="tbl-wrap" id="tblWrap">
  <div class="tbl-scroll">
    <table>
      <thead><tr>
        <th>FE / Product</th>
        <th>Referência do Cliente / Customer Reference</th>
        <th>Composição / Composition</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="tbl-wrap" id="savedImageWrap">
  <div class="tbl-scroll" style="max-height:420px;padding:12px;">
    <img id="savedImage" alt="Tabela de produtos enviada anteriormente"
         style="display:block;width:100%;height:auto;">
  </div>
</div>

<div class="sent-box" id="sentBox">
  ✔ Dados enviados ao campo do formulário. Envie o formulário para salvar a resposta.
</div>

<script>
// Set false if an empty answer should be accepted.
var REQUIRE_IMPORT = true;
var grouped = [];
var currentValue = '';
var widgetReady = false;
var importing = false;
var importVersion = 0;
var imageFilename = 'imported-table.png';
var savedImageValue = '';
var savedImageURL = '';


// Resolve saved image paths against the Jotform parent, not GitHub Pages.
function resolveSavedImage(value) {
  var metadata;
  try { metadata = JSON.parse(value).widget_metadata; } catch (error) { return ''; }
  if (!metadata || metadata.type !== 'imagelinks' || !Array.isArray(metadata.value)) return '';
  var image = metadata.value[0];
  if (!image) return '';
  var source = image.url || image.base64;
  if (typeof source !== 'string') return '';
  if (/^data:image\/(png|jpeg|gif|webp);base64,/i.test(source)) return source;
  if (source.startsWith('/uploads/') || source.startsWith('/widget-uploads/')) {
    var origin = typeof JFCustomWidget.getParentOrigin === 'function'
      ? JFCustomWidget.getParentOrigin() : 'https://www.jotform.com';
    try { return new URL(source, origin).href; } catch (error) { return ''; }
  }
  try {
    var url = new URL(source);
    return url.protocol === 'https:' ? url.href : '';
  } catch (error) { return ''; }
}

function showSavedImage(value) {
  var source = resolveSavedImage(value);
  if (!source) return false;
  savedImageValue = value;
  savedImageURL = source;
  document.getElementById('savedImage').src = source;
  document.getElementById('savedImageWrap').classList.add('on');
  dz.classList.add('hidden');
  tblWrap.classList.remove('on');
  chipsEl.classList.remove('on');
  metaBar.classList.add('on');
  btnReset.textContent = '↻ Substituir imagem';
  resizeWidget();
  return true;
}

function restoreSavedImage() {
  if (!savedImageValue) return;
  grouped = [];
  currentValue = savedImageValue;
  showSavedImage(currentValue);
  if (widgetReady) JFCustomWidget.sendData({ value: currentValue, valid: true });
}

function resizeWidget() {
  if (widgetReady && typeof JFCustomWidget.requestFrameResize === 'function') {
    try {
      JFCustomWidget.requestFrameResize({ height: document.body.scrollHeight + 32 });
    } catch (error) { /* Resizing is optional; keep data handling available. */ }
  }
}

function sendCurrentTable() {
  var success = true;
  try {
    currentValue = grouped.length ? buildWidgetValue() : '';
  } catch (error) {
    currentValue = '';
    success = false;
    if (statusTimer) clearTimeout(statusTimer);
    setStatus('err', 'Erro ao gerar PNG: ' + error.message);
  }
  if (widgetReady) {
    var valid = !importing && (!REQUIRE_IMPORT || currentValue !== '');

    JFCustomWidget.sendData({ value: currentValue, valid: valid });
  }
  resizeWidget();
  return success;
}

if (typeof JFCustomWidget !== 'undefined') {
  JFCustomWidget.subscribe('ready', function (data) {
    widgetReady = true;

    // Preserve an existing answer when opening an edited submission.
    if (!importVersion && !grouped.length && data && typeof data.value === 'string') {
      currentValue = data.value;
      if (currentValue) {
        if (showSavedImage(currentValue)) {
          setStatus('ok', 'Imagem salva. Para alterá-la, selecione outra planilha.');
        } else {
          setStatus('err', 'Não foi possível exibir a imagem salva. A resposta original foi preservada.');
          metaBar.classList.add('on');
        }
      }
    }
    JFCustomWidget.subscribe('submit', function () {

      // Reuse the generated PNG; do not regenerate it during submission.
      var valid = !importing && (!REQUIRE_IMPORT || currentValue !== '');
      if (!valid) {
        setStatus('err', importing
          ? 'Aguarde a conclusão da importação.'
          : 'Importe uma tabela antes de enviar o formulário.');
      }

      JFCustomWidget.sendSubmit({ value: currentValue, valid: valid });
    });

    if (importVersion && !importing) sendCurrentTable();
    resizeWidget();
  });
}

// ── Timers para auto-ocultar mensagens ────────────────────────────────────────
var statusTimer  = null;
var chipsTimer   = null;

// ── DOM ───────────────────────────────────────────────────────────────────────
var dz         = document.getElementById('dz');
var fileIn     = document.getElementById('fileIn');
var statusEl   = document.getElementById('status');
var metaBar    = document.getElementById('metaBar');
var chipsEl    = document.getElementById('chips');
var tblWrap    = document.getElementById('tblWrap');
var tbody      = document.getElementById('tbody');
var sentBox    = document.getElementById('sentBox');
var btnReset   = document.getElementById('btnReset');

// ── Clique na drop zone → abre o seletor de arquivo ──────────────────────────
dz.addEventListener('click', function(){
  fileIn.value = ''; // reset para permitir reselecionar o mesmo arquivo
  fileIn.click();
});

// ── Drag & Drop ───────────────────────────────────────────────────────────────
dz.addEventListener('dragenter', function(e){
  e.preventDefault();
  e.stopPropagation();
  dz.classList.add('over');
});
dz.addEventListener('dragover', function(e){
  e.preventDefault();
  e.stopPropagation();
  dz.classList.add('over');
});
dz.addEventListener('dragleave', function(e){
  e.preventDefault();
  e.stopPropagation();
  // Só remove o destaque se o cursor saiu da drop zone de verdade
  var rect = dz.getBoundingClientRect();
  if(e.clientX < rect.left || e.clientX > rect.right ||
     e.clientY < rect.top  || e.clientY > rect.bottom){
    dz.classList.remove('over');
  }
});
dz.addEventListener('drop', function(e){
  e.preventDefault();
  e.stopPropagation();
  dz.classList.remove('over');
  var files = e.dataTransfer.files;
  if(files && files[0]) handleFile(files[0]);
});

// ── Seleção via input ─────────────────────────────────────────────────────────
fileIn.addEventListener('change', function(){
  if(fileIn.files && fileIn.files[0]) handleFile(fileIn.files[0]);
});

// ── Despachante de arquivo ────────────────────────────────────────────────────
function handleFile(file) {
  var version = ++importVersion;
  // Keep the spreadsheet's base name, with a PNG extension.
  var baseName = file.name.replace(/\.[^.]+$/, '').replace(/[\\/:*?"<>|\u0000-\u001f\u007f]/g, '_').trim();
  imageFilename = (baseName || 'imported-table') + '.png';
  document.getElementById('savedImageWrap').classList.remove('on');
  importing = true;
  grouped = [];
  currentValue = '';
  tbody.innerHTML = '';
  tblWrap.classList.remove('on');
  sentBox.classList.remove('on');
  chipsEl.classList.remove('on');
  metaBar.classList.add('on');
  if (statusTimer) clearTimeout(statusTimer);
  if (chipsTimer) clearTimeout(chipsTimer);
  sendCurrentTable();
  setStatus('ok', 'Importando ' + file.name + '…');

  function fail(message) {
    if (version !== importVersion) return;
    importing = false;
    restoreSavedImage();
    setStatus('err', message);
  }
  function finish(rows) {
    if (version !== importVersion) return;
    importing = false;
    if (processRows(rows, file.name) === false) restoreSavedImage();
  }

  var ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'xlsx' || ext === 'xls') {
    if (typeof XLSX === 'undefined') {
      fail('Não foi possível carregar a biblioteca Excel. Recarregue a página.');
      return;
    }
    var reader = new FileReader();
    reader.onload = function (event) {
      if (version !== importVersion) return;
      try {
        var workbook = XLSX.read(event.target.result, { type: 'array' });
        var sheet = workbook.Sheets[workbook.SheetNames[0]];
        finish(XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: false }));
      } catch (error) {
        fail('Erro ao ler a planilha: ' + error.message);
      }
    };
    reader.onerror = function () { fail('Não foi possível ler o arquivo.'); };
    reader.onabort = function () { fail('Leitura cancelada.'); };
    reader.readAsArrayBuffer(file);
  } else if (ext === 'csv') {
    if (typeof Papa === 'undefined') {
      fail('Não foi possível carregar a biblioteca CSV. Recarregue a página.');
      return;
    }
    Papa.parse(file, {
      skipEmptyLines: 'greedy',
      complete: function (result) {
        if (result.errors && result.errors.length) {
          fail('CSV inválido: ' + result.errors[0].message);
          return;
        }
        finish(result.data);
      },
      error: function (error) { fail('Erro ao ler o CSV: ' + error.message); }
    });
  } else {
    fail('Formato inválido. Use .xlsx, .xls ou .csv.');
  }
}

// ── Processamento ─────────────────────────────────────────────────────────────
function processRows(rows, filename){
  if(!rows || rows.length < 2){ setStatus('err', '⚠ Arquivo sem dados.'); return false; }

  var header = rows[0].map(function(h){ return String(h || '').trim().toLowerCase(); });
  var iFE   = colIdx(header, ['fe','nfe','número fe','product','fe / product']);
  var iRef  = colIdx(header, ['referência do cliente','referencia do cliente','ref cliente','referência','referencia','customer reference','referência do cliente / customer reference']);
  var iComp = colIdx(header, ['composição','composicao','comp','composition','composição / composition']);
  if(iFE   < 0) iFE   = 0;
  if(iRef  < 0) iRef  = 1;
  if(iComp < 0) iComp = 2;

  var map = [], keyIndex = new Map();
  rows.slice(1).forEach(function(row){
    var fe   = String(row[iFE]   == null ? '' : row[iFE]).trim();
    var ref  = String(row[iRef]  == null ? '' : row[iRef]).trim();
    var comp = String(row[iComp] == null ? '' : row[iComp]).trim();
    if(!fe && !ref && !comp) return;
    var key = JSON.stringify([fe, ref]);
    if(!keyIndex.has(key)){ keyIndex.set(key, map.length); map.push({ fe: fe, ref: ref, comps: [] }); }
    if(comp && !map[keyIndex.get(key)].comps.includes(comp)) map[keyIndex.get(key)].comps.push(comp);
  });

  if(!map.length){ setStatus('err', '⚠ Nenhum dado encontrado.'); return false; }

  grouped = map;
  renderPreview();

  var total = map.reduce(function(s, r){ return s + r.comps.length; }, 0);

  // Exibe status de carregamento e oculta após 3 segundos
  setStatus('ok', '✓ ' + filename + ' carregado com sucesso.');
  if(statusTimer) clearTimeout(statusTimer);
  statusTimer = setTimeout(function(){
    statusEl.className = 'status';
    statusEl.innerHTML = '';
  }, 3000);

  chipsEl.innerHTML =
    '<span class="chip"><b>' + map.length + '</b>&nbsp;produto(s)</span>' +
    '<span class="chip"><b>' + total + '</b>&nbsp;composição(ões)</span>';

  dz.classList.add('hidden');
  metaBar.classList.add('on');
  chipsEl.classList.add('on');
  
  // Oculta APENAS os chips após 5 segundos, mantém a metaBar (onde está o botão Novo Arquivo)
  if(chipsTimer) clearTimeout(chipsTimer);
  chipsTimer = setTimeout(function(){
    chipsEl.classList.remove('on');
  }, 5000);

  tblWrap.classList.add('on');
  if (!sendCurrentTable()) return false;
  savedImageValue = '';
  savedImageURL = '';
  btnReset.textContent = '↩ Novo arquivo';
  sentBox.textContent = widgetReady
    ? '✔ PNG pronto. Envie o formulário para salvar a imagem.'
    : 'PNG pronto. Aguardando conexão com o formulário Jotform.';
  sentBox.classList.add('on');
  resizeWidget();
}

function colIdx(header, candidates){
  for(var i = 0; i < header.length; i++)
    if(candidates.indexOf(header[i]) > -1) return i;
  return -1;
}

// ── Preview ───────────────────────────────────────────────────────────────────
function renderPreview(){
  tbody.innerHTML = '';
  grouped.forEach(function(item){
    var comps = item.comps.length ? item.comps : ['—'];
    comps.forEach(function(comp, ci){
      var tr = document.createElement('tr');
      if(ci === 0){
        tr.appendChild(makeTD(item.fe,  comps.length, 'col-fe'));
        tr.appendChild(makeTD(item.ref, comps.length, 'col-ref'));
      }
      var td = document.createElement('td');
      td.className   = 'col-comp';
      td.textContent = comp;
      tr.appendChild(td);
      tbody.appendChild(tr);
    });
  });
}

function makeTD(text, span, cls){
  var td = document.createElement('td');
  td.className   = cls;
  td.textContent = text;
  td.rowSpan     = span;
  return td;
}

// ── Tabela HTML para o JotForm ────────────────────────────────────────────────
// Render every imported row directly to canvas. No screenshot library or server.
function buildWidgetValue() {
  var canvas = renderTablePNG();
  var dataURL = canvas.toDataURL('image/png');
  if (!dataURL.startsWith('data:image/png;base64,')) {
    throw new Error('Não foi possível gerar a imagem PNG.');
  }
  // Keep the entire Data URL, including data:image/png;base64,.
  // Jotform's submission handler saves this PNG and replaces base64 with url.
  return JSON.stringify({
    widget_metadata: {
      type: 'imagelinks',
      value: [{ name: imageFilename, base64: dataURL }]
    }
  });
}

function renderTablePNG() {
  var width = 1100;
  var widths = [190, 410, 500];
  var padding = 14;
  var lineHeight = 24;
  var font = '18px Arial, sans-serif';
  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d');
  if (!ctx) throw new Error('Canvas não está disponível neste navegador.');
  ctx.font = font;

  function wrap(text, maxWidth) {
    var result = [];
    String(text == null ? '' : text).split(/\r\n|\r|\n/).forEach(function (paragraph) {
      var line = '';
      // Character wrapping also handles long product codes without spaces.
      Array.from(paragraph).forEach(function (character) {
        if (line && ctx.measureText(line + character).width > maxWidth) {
          result.push(line);
          line = '';
        }
        line += character;
      });
      result.push(line);
    });
    return result;
  }
  var headings = [
    'FE / Product',
    'Referência do Cliente / Customer Reference',
    'Composição / Composition'
  ];
  ctx.font = 'bold ' + font;
  var headerLines = headings.map(function (text, i) { return wrap(text, widths[i] - 2 * padding); });
  var headerHeight = Math.max.apply(null, headerLines.map(function (lines) { return lines.length; })) * lineHeight + 2 * padding;
  ctx.font = font;
  var blocks = grouped.map(function (item) {
    var fe = wrap(item.fe, widths[0] - 2 * padding);
    var ref = wrap(item.ref, widths[1] - 2 * padding);
    var compositions = (item.comps.length ? item.comps : ['—']).map(function (comp) {
      var lines = wrap(comp, widths[2] - 2 * padding);
      return { lines: lines, height: lines.length * lineHeight + 2 * padding };
    });
    var compHeight = compositions.reduce(function (sum, comp) { return sum + comp.height; }, 0);
    var height = Math.max(compHeight, fe.length * lineHeight + 2 * padding, ref.length * lineHeight + 2 * padding);
    compositions[compositions.length - 1].height += height - compHeight;
    return { fe: fe, ref: ref, compositions: compositions, height: height };
  });
  var height = headerHeight + blocks.reduce(function (sum, block) { return sum + block.height; }, 0) + 2;
  // Bound canvas memory and dimensions; reject oversized tables instead of cropping.
  var scale = Math.min(2, 16380 / height, Math.sqrt(24000000 / (width * height)));
  if (scale < 1) {
    throw new Error('Tabela muito grande para uma única imagem. Importe menos linhas.');
  }
  canvas.width = Math.ceil((width + 2) * scale);
  canvas.height = Math.ceil(height * scale);
  ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  ctx.translate(1, 1);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-1, -1, width + 2, height);
  ctx.textBaseline = 'top';
  ctx.lineWidth = 1;

  function cell(x, y, w, h, lines, background, foreground, bold) {
    ctx.fillStyle = background;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#c8cdd8';
    ctx.strokeRect(x, y, w, h);
    ctx.font = (bold ? 'bold ' : '') + font;
    ctx.fillStyle = foreground;
    var textY = y + Math.max(padding, (h - lines.length * lineHeight) / 2);
    lines.forEach(function (line, i) { ctx.fillText(line, x + padding, textY + i * lineHeight); });
  }
  var x = 0;
  headerLines.forEach(function (lines, i) {
    cell(x, 0, widths[i], headerHeight, lines, '#666666', '#ffffff', true);
    x += widths[i];
  });
  var y = headerHeight;
  var rowIndex = 0;
  blocks.forEach(function (block) {
    cell(0, y, widths[0], block.height, block.fe, '#ffffff', '#000000', true);
    cell(widths[0], y, widths[1], block.height, block.ref, '#ffffff', '#000000', false);
    var compY = y;
    block.compositions.forEach(function (comp) {
      cell(widths[0] + widths[1], compY, widths[2], comp.height, comp.lines, rowIndex++ % 2 ? '#f8faff' : '#ffffff', '#000000', false);
      compY += comp.height;
    });
    y += block.height;
  });
  return canvas;
}

function esc(v){
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── Reset ─────────────────────────────────────────────────────────────────────
btnReset.addEventListener('click', function(){
  if (savedImageValue) {
    // Opening or cancelling the picker keeps the saved image and answer.
    fileIn.value = '';
    fileIn.click();
    return;
  }
  document.getElementById('savedImageWrap').classList.remove('on');
  document.getElementById('savedImage').removeAttribute('src');
  importVersion++;
  importing = false;
  grouped      = [];
  currentValue = '';
  fileIn.value = '';
  tbody.innerHTML    = '';
  statusEl.className = 'status';
  statusEl.innerHTML = '';
  if(statusTimer)  clearTimeout(statusTimer);
  if(chipsTimer)   clearTimeout(chipsTimer);
  dz.classList.remove('hidden');
  metaBar.classList.remove('on');
  chipsEl.classList.remove('on');
  tblWrap.classList.remove('on');
  sentBox.classList.remove('on');
  sendCurrentTable();
});

document.getElementById('savedImage').addEventListener('load', resizeWidget);
document.getElementById('savedImage').addEventListener('error', function () {
  setStatus('err', 'Não foi possível carregar a imagem. A resposta salva foi preservada; você pode substituí-la por outra planilha.');
});

// ── Helper status ─────────────────────────────────────────────────────────────
function setStatus(type, message){
  statusEl.className = 'status ' + type;
  statusEl.textContent = message;
  resizeWidget();
}

dz.addEventListener('keydown', function (event) {
  if (event.key === 'Enter' || event.key === ' ') {
    event.preventDefault();
    fileIn.click();
  }
});
